# Builds the frontend image with the API URL baked in.
#   gcloud builds submit frontend --config frontend/cloudbuild.yaml \
#     --substitutions _API_URL=https://<backend>/api,_IMAGE=<region>-docker.pkg.dev/<project>/<repo>/<name>:<tag>
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "--build-arg", "VITE_API_BASE_URL=${_API_URL}", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
