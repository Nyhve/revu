name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: overvu
          POSTGRES_USER: overvu
          POSTGRES_PASSWORD: overvu
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://overvu:overvu@localhost:5432/overvu?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Apply Flyway migrations
        run: >
          docker run --rm --network host
          -v "$PWD/migrations:/flyway/sql:ro"
          flyway/flyway:11
          -url=jdbc:postgresql://localhost:5432/overvu -user=overvu -password=overvu migrate

      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: "1.29.0"

      - name: Generated code is up to date
        run: sqlc diff

      - name: Vet
        run: go vet ./...

      - name: Test (unit + full API contract suite against Postgres)
        run: go test -race -count=1 ./...

      - name: Build
        run: CGO_ENABLED=0 go build -o /tmp/server ./cmd/server

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package*.json

      - name: Install
        # Uses the lockfile once it is committed (run `npm install` locally and commit package-lock.json).
        run: if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Lint
        run: npm run lint

      - name: Type check and build
        env:
          VITE_API_BASE_URL: http://localhost:8080/api
        run: npm run build
